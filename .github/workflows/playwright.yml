name: Playwright Tests
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
permissions:
  contents: write  # Needed for pushing report to gh-pages branch
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
 
      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci
 
      # 4️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
 
      # 5️⃣ Run Playwright tests (generate HTML report)
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
 
      # 6️⃣ Fix HTML paths for GitHub Pages (so JS & CSS load correctly)
      - name: Fix report paths for GitHub Pages
        run: |
          sed -i 's|href="/|href="./|g' playwright-report/index.html
          sed -i 's|src="/|src="./|g' playwright-report/index.html
          sed -i 's|"/assets|".\/assets|g' playwright-report/index.html
 
      # 7️⃣ Deploy the report to GitHub Pages
      - name: Deploy Playwright HTML report to GitHub Pages
        if: always()  # Runs even if tests fail
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          publish_branch: gh-pages